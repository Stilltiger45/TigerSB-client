name: Android

# Every pull request builds a test APK. Publishing a release on the Releases
# page builds the release APKs and attaches them to it. A release that missed
# its build can get the APKs by running this workflow by hand with its tag.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить APK (например v0.1.0)"
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The release to attach the APKs to; empty for test builds.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # A release builds its own tag; a manual run builds the branch it was
      # started on and attaches the APKs to the release named in "tag".
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # The tag gives the version: v0.1.0, V0.1 and 0.1 all become 0.1.0.
      - name: Version
        id: ver
        run: |
          name=0.0.0
          if [ -n "$TAG" ]; then
            IFS=. read -r a b c _ <<< "${TAG#[vV]}"
            name="${a:-0}.${b:-0}.${c:-0}"
            if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Тег $TAG не похож на номер версии, например v0.1.0"
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Go core (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: scripts/build-core-android.sh

      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Without these secrets the APK is signed with a throwaway debug key and
      # a later version will not install over it. See README.
      - name: Signing key
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Секреты подписи не заданы: APK подписан отладочным ключом"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > key.properties

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.ver.outputs.name }}" \
            --build-number "${{ github.run_number }}"
          mkdir -p ../dist
          # The names carry no version: one release keeps exactly these two
          # files, and every build replaces them.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/TigerSB-android.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/TigerSB-android-old-phones.apk
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: TigerSB-android
          path: dist/*.apk

      # Only the two APKs of this build stay in the release: older APKs,
      # whatever their names, are removed first.
      - name: Remove old APKs from the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep '\.apk$' |
            while read -r name; do
              gh release delete-asset "$TAG" "$name" -R "$GITHUB_REPOSITORY" -y
            done

      - name: Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.apk
          body: |
            **Android:** скачайте `TigerSB-android.apk` и откройте его на телефоне. Если телефон старше 2017 года и приложение не ставится, возьмите `TigerSB-android-old-phones.apk`.

            После установки вставьте ключ или отсканируйте QR-код и нажмите «Подключить». Новая версия ставится поверх старой, ключ сохраняется.

  # Starts the release build on an emulator and checks that the key screen
  # appears. Logcat and a screenshot are kept as the artifact
  # TigerSB-android-smoke, so a startup failure can be read without a phone.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Go core (gomobile, x86_64 for the emulator)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          TARGETS: android/amd64
        run: scripts/build-core-android.sh

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/smoke-android.sh app/build/app/outputs/flutter-apk/app-release.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TigerSB-android-smoke
          path: smoke/
