name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o tigersb-core-ci ./cmd/tigersb-core
        env:
          CGO_ENABLED: "0"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/check-licenses.sh
      - name: THIRD_PARTY_NOTICES.md up to date
        run: scripts/check-licenses.sh --notices | diff -u <(sed -n '/^| Модуль/,$p' THIRD_PARTY_NOTICES.md) -
      - name: app/assets/licenses.json up to date
        run: go run ./scripts/licensetexts && git diff --exit-code app/assets/licenses.json
