name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      # One system failing should not hide what the other found.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          # Failed tests also go to the annotations, readable without the log.
          # Actions runs bash with -e and pipefail, so the status is caught
          # here rather than ending the step before the annotations.
          status=0
          go test ./... 2>&1 | tee test.log || status=$?
          if [ "$status" != 0 ]; then
            # Errors before any test ran (the go tool, a test binary that
            # did not start) have none of these marks: then the log's tail.
            { grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test.log || tail -n 15 test.log; } | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - run: go build -o tigersb-core-ci ./cmd/tigersb-core
        env:
          CGO_ENABLED: "0"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/check-licenses.sh
      - name: THIRD_PARTY_NOTICES.md up to date
        run: scripts/check-licenses.sh --notices | diff -u <(sed -n '/^| Модуль/,$p' THIRD_PARTY_NOTICES.md) -
      - name: app/assets/licenses.json up to date
        run: go run ./scripts/licensetexts && git diff --exit-code app/assets/licenses.json
