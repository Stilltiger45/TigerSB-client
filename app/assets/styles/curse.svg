<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gc" x1="0" y1="0.1" x2="0" y2="0.9">
      <stop offset="0" stop-color="#FF7A86"/>
      <stop offset="1" stop-color="#C0122C"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
  <g fill="none" stroke="url(#gc)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- a horned mask -->
    <path d="M30 30 L22 13 L39 24"/>
    <path d="M70 30 L78 13 L61 24"/>
    <path d="M39 24 C46 21 54 21 61 24 C72 28 78 38 78 50 C78 68 66 84 50 86 C34 84 22 68 22 50 C22 38 28 28 39 24"/>
    <!-- fangs -->
    <path d="M38 70 L42 68 L45 73 L50 69 L55 73 L58 68 L62 70"/>
  </g>
  <g fill="url(#gc)">
    <!-- four eyes -->
    <path d="M34 42 Q40 37 46 41 Q40 45 34 42 Z"/>
    <path d="M66 42 Q60 37 54 41 Q60 45 66 42 Z"/>
    <path d="M36 51 Q41 47.5 46 50.5 Q41 53.5 36 51 Z"/>
    <path d="M64 51 Q59 47.5 54 50.5 Q59 53.5 64 51 Z"/>
    <!-- marks on the forehead and the cheeks -->
    <path d="M47.5 27 L52.5 27 L50 35 Z"/>
    <path d="M26 56 L37 59 L26 61 Z"/>
    <path d="M74 56 L63 59 L74 61 Z"/>
