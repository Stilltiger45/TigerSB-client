name: tigersb
description: "TigerSB VPN client"
publish_to: 'none'

# CI sets the version from the git tag (v1.2.3 -> 1.2.3, build number = run number).
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tiger.png
